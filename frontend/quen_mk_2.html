<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Inter:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_layout.css">
</head>
<body>
    <div class="background-pink">
        <div class="split-card">
            <div class="card-left">
                <img src="book.jpg" alt="Sách">
            </div>
            <div class="card-right">
                <h1 class="title">QUÊN MẬT KHẨU</h1>
                
                <form class="reset-password-form">
                    <div class="input-wrapper">
                        <div class="input-group password-group">
                            <input type="password" id="new_pass" placeholder="Nhập mật khẩu mới" required>
                            <button type="button" class="toggle-password">
                                <img src="icon/Eye.svg" width="20" height="20">
                            </button>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="input-group password-group">
                            <input type="password" id="new_pass_confirm" placeholder="Nhập lại mật khẩu mới" required>
                            <button type="button" class="toggle-password">
                                <img src="icon/Eye.svg" width="20" height="20">
                            </button>
                        </div>
                    </div>
                    
                    <div class="btn-container">
                        <button type="button" class="btn-continue" id="btnResetPass">Tiếp tục</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="footer-text">Mỗi trang sách, một thế giới mới ✿</div>
    </div>
    <script>
        const toggleBtns = document.querySelectorAll('.toggle-password');
        toggleBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                const pwdInput = this.parentElement.querySelector('input');
                const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
                pwdInput.setAttribute('type', type);
                this.querySelector('img').src = type === 'text' ? 'icon/Eye off.svg' : 'icon/Eye.svg';
            });
        });

        // Xử lý nút Đổi Mật Khẩu
        document.getElementById('btnResetPass').addEventListener('click', async function() {
            const newPass = document.getElementById('new_pass').value.trim();
            const newPassConfirm = document.getElementById('new_pass_confirm').value.trim();
            const contact = sessionStorage.getItem('reset_contact');

            // Nếu không có contact (người dùng tự ý vào trang này mà không qua bước 1)
            if (!contact) {
                alert("Phiên làm việc đã hết hạn hoặc bạn chưa nhập OTP. Vui lòng quay lại bước 1.");
                window.location.href = 'quen_mk.html';
                return;
            }

            if (!newPass || !newPassConfirm) {
                alert("Vui lòng nhập đầy đủ mật khẩu mới!");
                return;
            }

            if (newPass !== newPassConfirm) {
                alert("Mật khẩu nhập lại không khớp!");
                return;
            }

            const btn = this;
            btn.innerText = "ĐANG XỬ LÝ...";
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8000/api/forgot-password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contact: contact, new_password: newPass })
                });
                const data = await res.json();

                if (res.ok) {
                    alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại bằng mật khẩu mới.");
                    sessionStorage.removeItem('reset_contact'); // Xóa session
                    window.location.href = 'login.html';
                } else {
                    alert("Lỗi: " + data.detail);
                }
            } catch (e) {
                alert("Lỗi kết nối máy chủ API!");
            } finally {
                btn.innerText = "Tiếp tục";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
