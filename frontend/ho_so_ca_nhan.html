<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Gợi Ý Sách</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style_trang_chu.css">

    <style>
        .profile-container { display: flex; gap: 30px; margin-top: 20px; }
        .profile-card { background: #FDF0F0; border-radius: 20px; padding: 30px; flex: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; }
        .details-card { background: #FDF0F0; border-radius: 20px; padding: 30px; flex: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .avatar-circle { width: 100px; height: 100px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; border: 3px solid var(--primary-color); }
        .avatar-circle i { font-size: 50px; color: var(--primary-color); }
        .username-display { font-family: 'Agbalumo', cursive; color: var(--primary-color); font-size: 24px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .username-input { font-family: 'Agbalumo', cursive; color: var(--primary-color); font-size: 24px; margin-bottom: 25px; background: transparent; border: 1px dashed var(--primary-color); text-align: center; display: none; width: 100%; outline: none; }
        .edit-icon { cursor: pointer; transition: 0.2s; }
        .edit-icon:hover { transform: scale(1.1); }
        .input-group { width: 100%; margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: var(--primary-color); font-weight: bold; margin-bottom: 5px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .custom-input { width: 100%; padding: 10px 40px 10px 15px; border-radius: 20px; border: 1px solid #ddd; font-size: 14px; outline: none; background: #fff; color: #333; font-family: 'Inter', sans-serif; appearance: none; -webkit-appearance: none; }
        .custom-input:disabled { background: #f9f9f9; color: #888; border: 1px dashed #ccc; }
        .custom-textarea { width: 100%; padding: 15px; border-radius: 20px; border: 1px solid #ddd; font-size: 14px; outline: none; background: #fff; resize: vertical; min-height: 100px; color: #333; font-family: 'Inter', sans-serif; }
        .custom-textarea:disabled { background: #f9f9f9; color: #888; border: 1px dashed #ccc; }
        .input-icon { position: absolute; right: 15px; width: 20px; height: 20px; pointer-events: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: auto; height: auto; color: transparent; background: transparent; cursor: pointer; }
        .btn-container { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        .btn-action { background: white; color: var(--primary-color); border: 2px solid var(--primary-color); padding: 10px 40px; border-radius: 25px; font-family: 'Agbalumo', cursive; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: var(--primary-color); color: white; transform: translateY(-2px); }
        .btn-save { display: none; background: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="menu-toggle" id="menu-btn"><i class="fa-solid fa-bars"></i></div>
        <ul class="nav-list">
            <li class="nav-item"><a href="trang_chu.html"><img src="icon/trang_chu.svg" class="nav-icon" alt="Trang chủ"><span class="nav-text">Trang chủ</span></a></li>
            <li class="nav-item"><a href="danh_cho_bn.html"><img src="icon/danh_cho_bn.svg" class="nav-icon" alt="Dành cho bạn"><span class="nav-text">Dành cho bạn</span></a></li>
            <li class="nav-item"><a href="lich_su_doc.html"><img src="icon/lich_su_doc.svg" class="nav-icon" alt="Lịch sử đọc"><span class="nav-text">Lịch sử đọc</span></a></li>
            <li class="nav-item"><a href="yeu_thich.html"><img src="icon/book-heart.svg" class="nav-icon" alt="Yêu thích"><span class="nav-text">Yêu thích</span></a></li>
            <li class="nav-item"><a href="cap_nhat_so_thich.html"><img src="icon/book-cap_nhat.svg" class="nav-icon" alt="Cập nhật sở thích"><span class="nav-text">Cập nhật sở thích</span></a></li>
        </ul>
        <div class="bottom-menu">
            <ul class="nav-list">
                <li class="nav-item active"><a href="ho_so_ca_nhan.html"><img src="icon/card-outline.svg" class="nav-icon" alt="Hồ sơ cá nhân"><span class="nav-text">Hồ sơ cá nhân</span></a></li>
                <li class="nav-item"><a href="login.html" id="btn-logout"><img src="icon/sign-out.svg" class="nav-icon" alt="Đăng xuất"><span class="nav-text">Đăng xuất.</span></a></li>
            </ul>
        </div>
        <div class="mascot-container">
            <img src="linh_vat_1.png" alt="Linh vật" class="mascot-img">
        </div>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="search-bar">
                <img src="icon/search.svg" class="search-icon" alt="Tìm kiếm">
                <input type="text" placeholder="Chào ngày mới! Hôm nay bạn muốn khám phá thế giới nào?">
            </div>
        </header>

        <div class="content-wrapper">
            <div class="profile-container">
                <!-- CỘT TRÁI: THÔNG TIN CƠ BẢN -->
                <div class="profile-card">
                    <div class="avatar-circle">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    
                    <div class="username-display" id="displayName">
                        <span id="nameText">Đang tải...</span>
                        <img src="icon/bi_pen.svg" alt="Sửa" class="edit-icon" id="btnEditName" style="display: none; margin-left: 8px;">
                    </div>
                    <input type="text" id="inputName" class="username-input" value="">

                    <div class="input-group">
                        <label>Số điện thoại</label>
                        <input type="text" id="inputPhone" class="custom-input profile-field" placeholder="Chưa cập nhật" disabled>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="inputEmail" class="custom-input profile-field" placeholder="Chưa cập nhật" disabled>
                    </div>

                    <div class="input-group">
                        <label>Trích dẫn tâm đắc</label>
                        <textarea id="inputQuote" class="custom-textarea profile-field" placeholder="Viết một câu trích dẫn bạn thích nhất..." disabled></textarea>
                    </div>
                </div>

                <!-- CỘT PHẢI: CHI TIẾT NGƯỜI DÙNG -->
                <div class="details-card">
                    <h2 style="font-family: 'Agbalumo', cursive; color: var(--primary-color); text-align: center; margin-bottom: 30px; font-size: 26px;">Chi tiết người dùng</h2>
                    
                    <div class="input-group">
                        <label>Ngày/ Tháng/ Năm sinh của bạn</label>
                        <div class="input-wrapper">
                            <input type="date" id="inputDOB" class="custom-input profile-field" disabled>
                            <img src="icon/lich.svg" class="input-icon" alt="Lịch">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Giới tính</label>
                        <div class="input-wrapper">
                            <select id="inputGender" class="custom-input profile-field" disabled>
                                <option value="">-- Chọn giới tính --</option>
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                                <option value="Khác">Khác</option>
                            </select>
                            <img src="icon/people.svg" class="input-icon" alt="Giới tính">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Thể loại yêu thích</label>
                        <textarea id="inputGenres" class="custom-textarea profile-field" disabled placeholder="Nhập các thể loại, cách nhau bằng dấu phẩy..."></textarea>
                    </div>

                    <div class="input-group">
                        <label>Tác giả yêu thích</label>
                        <textarea id="inputAuthors" class="custom-textarea profile-field" disabled placeholder="Nhập tên tác giả, cách nhau bằng dấu phẩy..."></textarea>
                    </div>

                    <div class="btn-container">
                        <button class="btn-action" id="btnUpdate">Cập nhật</button>
                        <button class="btn-action btn-save" id="btnSave">Lưu</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.querySelector('.main-content');
        menuBtn.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); mainContent.classList.toggle('expanded'); });

        const userId = localStorage.getItem('user_id');
        if (!userId) { window.location.href = 'login.html'; }

        // 1. TẢI DỮ LIỆU TỪ API
        async function loadProfileData() {
            try {
                const res = await fetch(`http://localhost:8000/api/user/profile/${encodeURIComponent(userId)}`);
                const data = await res.json();
                
                const finalName = data.name || localStorage.getItem('username') || "Người dùng";
                document.getElementById('nameText').innerText = finalName;
                document.getElementById('inputName').value = finalName;
                
                document.getElementById('inputPhone').value = data.phone || "";
                document.getElementById('inputEmail').value = data.email || "";
                document.getElementById('inputQuote').value = data.quote || "";
                document.getElementById('inputDOB').value = data.dob || "";
                document.getElementById('inputGender').value = data.gender || "";
                
                document.getElementById('inputGenres').value = (data.genres || []).join(", ");
                document.getElementById('inputAuthors').value = (data.authors || []).join(", ");
                
                // Đồng bộ lại local để các trang khác dùng nếu cần
                localStorage.setItem('user_genres', JSON.stringify(data.genres || []));
                localStorage.setItem('user_authors', JSON.stringify(data.authors || []));
            } catch (e) {
                console.error("Lỗi tải hồ sơ", e);
                // Fallback
                document.getElementById('nameText').innerText = localStorage.getItem('username') || "Người dùng";
            }
        }
        loadProfileData();

        // 2. LOGIC MỞ KHÓA / LƯU
        const btnUpdate = document.getElementById('btnUpdate');
        const btnSave = document.getElementById('btnSave');
        const fields = document.querySelectorAll('.profile-field'); 
        const btnEditName = document.getElementById('btnEditName');
        const nameText = document.getElementById('nameText');
        const inputName = document.getElementById('inputName');

        btnUpdate.addEventListener('click', () => {
            btnUpdate.style.display = 'none';
            btnSave.style.display = 'block';
            btnEditName.style.display = 'inline-block';
            fields.forEach(field => field.removeAttribute('disabled'));
        });

        btnEditName.addEventListener('click', () => {
            nameText.style.display = 'none';
            btnEditName.style.display = 'none';
            inputName.style.display = 'block';
            inputName.focus();
        });

        btnSave.addEventListener('click', async () => {
            if (inputName.style.display === 'block') {
                nameText.innerText = inputName.value;
                inputName.style.display = 'none';
                nameText.style.display = 'block';
            }
            btnEditName.style.display = 'none';
            fields.forEach(field => field.setAttribute('disabled', 'true'));

            const newGenres = document.getElementById('inputGenres').value.split(',').map(i => i.trim()).filter(i => i);
            const newAuthors = document.getElementById('inputAuthors').value.split(',').map(i => i.trim()).filter(i => i);

            const payload = {
                user_id: userId,
                name: document.getElementById('nameText').innerText,
                phone: document.getElementById('inputPhone').value,
                email: document.getElementById('inputEmail').value,
                quote: document.getElementById('inputQuote').value,
                dob: document.getElementById('inputDOB').value,
                gender: document.getElementById('inputGender').value,
                genres: newGenres,
                authors: newAuthors,
                books: [], // Không sửa sách ở đây
                profile_source: 'updated'
            };

            const originalText = btnSave.innerText;
            btnSave.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';
            
            try {
                // Giữ lại sách cũ trước khi ghi đè
                const pRes = await fetch(`http://localhost:8000/api/user/profile/${encodeURIComponent(userId)}`);
                const pData = await pRes.json();
                payload.books = pData.books || [];

                await fetch('http://localhost:8000/api/user/profile', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                localStorage.setItem('user_genres', JSON.stringify(newGenres));
                localStorage.setItem('user_authors', JSON.stringify(newAuthors));
                localStorage.setItem('user_profile', JSON.stringify({ name: payload.name, phone: payload.phone, email: payload.email, quote: payload.quote, dob: payload.dob, gender: payload.gender }));

                btnSave.innerHTML = '<i class="fa-solid fa-check"></i> Đã lưu';
                btnSave.style.background = '#4CAF50'; btnSave.style.borderColor = '#4CAF50';
                setTimeout(() => {
                    btnSave.style.display = 'none'; btnUpdate.style.display = 'block';
                    btnSave.innerText = originalText; btnSave.style.background = ''; btnSave.style.borderColor = '';
                }, 1500);
            } catch (e) {
                alert("Lỗi khi lưu dữ liệu!");
                btnSave.innerText = originalText;
            }
        });

        document.getElementById('btn-logout').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
