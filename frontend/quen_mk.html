<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Inter:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_layout.css">
</head>
<body>
    <div class="background-pink">
        <div class="split-card">
            <div class="card-left">
                <img src="book.jpg" alt="Sách">
            </div>
            <div class="card-right">
                <h1 class="title">QUÊN MẬT KHẨU</h1>
                <p class="instruction-text">Một chút đãng trí cũng không sao, cùng tạo lại mật khẩu mới bảo mật hơn nhé ( • ω • )✧</p>
                
                <form class="forgot-password-form">
                    <div class="input-wrapper">
                        <div class="input-group">
                            <input type="text" placeholder="Nhập số điện thoại của bạn" required>
                        </div>
                    </div>
                    <p class="instruction-text">Đợi mình chút nhé, mình sẽ gửi OTP về số điện thoại của bạn ngay đây ✧</p>
                    <div class="input-wrapper">
                        <div class="input-group">
                            <input type="text" placeholder="Nhập mã OTP" required>
                        </div>
                    </div>
                    
                    <div class="btn-group">
                        <button type="button" class="btn-back" onclick="window.location.href='login.html'">Quay lại</button>
                        <button type="button" class="btn-continue" onclick="window.location.href='quen_mk_2.html'">Tiếp tục</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="footer-text">Mỗi trang sách, một thế giới mới ✿</div>
    </div>
</body>
</html>
