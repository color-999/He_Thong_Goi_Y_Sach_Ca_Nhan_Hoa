<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sách Yêu Thích - Hệ Thống Gợi Ý Sách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style_trang_chu.css">
    <style>
        .book-card { position: relative; }
        .btn-unlike { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.9); color: #DF6B8A; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; display: flex; justify-content: center; align-items: center; font-size: 16px; opacity: 0; z-index: 10; }
        .book-card:hover .btn-unlike { opacity: 1; }
        .btn-unlike:hover { transform: scale(1.15); background: #FDF0F0; }
        .empty-favorites { text-align: center; padding: 60px 0; color: #888; }
        .empty-favorites i { font-size: 60px; color: #F0B8C6; margin-bottom: 20px; }
        .empty-favorites h2 { font-family: 'Agbalumo', cursive; color: var(--primary-color); margin-bottom: 10px;}
        .btn-explore { display: inline-block; margin-top: 15px; padding: 10px 25px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 20px; font-weight: 600; transition: 0.2s; }
        .btn-explore:hover { background: #6e161f; }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="menu-toggle" id="menu-btn"><i class="fa-solid fa-bars"></i></div>
        <ul class="nav-list">
            <li class="nav-item"><a href="trang_chu.html"><img src="icon/trang_chu.svg" class="nav-icon" alt="Trang chủ"><span class="nav-text">Trang chủ</span></a></li>
            <li class="nav-item"><a href="danh_cho_bn.html"><img src="icon/danh_cho_bn.svg" class="nav-icon" alt="Dành cho bạn"><span class="nav-text">Dành cho bạn</span></a></li>
            <li class="nav-item"><a href="lich_su_doc.html"><img src="icon/lich_su_doc.svg" class="nav-icon" alt="Lịch sử đọc"><span class="nav-text">Lịch sử đọc</span></a></li>
            <li class="nav-item active"><a href="yeu_thich.html"><img src="icon/book-heart.svg" class="nav-icon" alt="Yêu thích"><span class="nav-text">Yêu thích</span></a></li>
            <li class="nav-item"><a href="cap_nhat_so_thich.html"><img src="icon/book-cap_nhat.svg" class="nav-icon" alt="Cập nhật sở thích"><span class="nav-text">Cập nhật sở thích</span></a></li>
        </ul>
        <div class="bottom-menu">
            <ul class="nav-list">
                <li class="nav-item"><a href="ho_so_ca_nhan.html"><img src="icon/card-outline.svg" class="nav-icon" alt="Hồ sơ cá nhân"><span class="nav-text">Hồ sơ cá nhân</span></a></li>
                <li class="nav-item"><a href="login.html"><img src="icon/sign-out.svg" class="nav-icon" alt="Đăng xuất"><span class="nav-text">Đăng xuất.</span></a></li>
            </ul>
        </div>
        <div class="mascot-container"><img src="linh_vat_1.png" alt="Linh vật" class="mascot-img"></div>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1 style="font-family: 'Agbalumo', cursive; color: var(--primary-color);">Sách Yêu Thích Của Bạn</h1>
            <p style="color: #666; margin-top: 5px;">Thư viện cá nhân chứa những cuốn sách yêu thích của bạn.</p>
        </header>
        <div class="content-wrapper" id="favorites-container">
            <p style="text-align: center; color: #888; padding: 40px;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải thư viện yêu thích...</p>
        </div>
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.querySelector('.main-content');
        menuBtn.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); mainContent.classList.toggle('expanded'); });

        function generateStars(rating) {
            const safeRating = Math.max(0, Math.min(5, Number(rating) || 0));
            if (!safeRating) return '<span style="color:#999;font-size:11px;font-style:italic">Chưa có đánh giá</span>';
            let starsHTML = '';
            const fullStars = Math.floor(safeRating);
            const hasHalfStar = safeRating - fullStars >= 0.5 ? 1 : 0;
            const emptyStars = 5 - fullStars - hasHalfStar;
            for (let i = 0; i < fullStars; i++) starsHTML += '<i class="fa-solid fa-star" style="color: #FFD700; font-size: 12px; margin-right:2px"></i>';
            if (hasHalfStar) starsHTML += '<i class="fa-solid fa-star-half-stroke" style="color: #FFD700; font-size: 12px; margin-right:2px"></i>';
            for (let i = 0; i < emptyStars; i++) starsHTML += '<i class="fa-regular fa-star" style="color: #FFD700; font-size: 12px; margin-right:2px"></i>';
            return starsHTML;
        }

        function createFavBookCard(bookId, imgSrc, title, author, rating) {
            return `
                <div class="book-card" id="fav-book-${bookId}">
                    <button class="btn-unlike" title="Bỏ yêu thích" onclick="removeFavorite('${bookId}', event)"><i class="fa-solid fa-heart"></i></button>
                    <a href="chi_tiet_sach.html?id=${bookId}" style="text-decoration: none; color: inherit; display: block;">
                        <img src="${imgSrc}" alt="${title}" class="book-cover-img">
                        <div class="book-stars">${generateStars(rating)}</div>
                        <h3 class="book-title" style="margin-top: 5px;">${title}</h3>
                        <p class="book-author">${author}</p>
                    </a>
                </div>
            `;
        }

        async function syncFavoritesToApi(favorites) {
            const userId = localStorage.getItem('user_id');
            if (!userId) return;
            try { await fetch('http://localhost:8000/api/user/favorites', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:userId, favorites}) }); } catch (error) { console.warn(error); }
        }

        async function removeFavorite(bookId, event) {
            event.preventDefault(); 
            if(confirm("Bạn muốn xóa cuốn này khỏi danh sách Yêu thích?")) {
                const card = document.getElementById(`fav-book-${bookId}`);
                if(card) { card.style.opacity = '0.5'; setTimeout(() => { card.remove(); }, 300); }
                let favorites = JSON.parse(localStorage.getItem('my_favorites')) || [];
                favorites = favorites.filter(book => book.id !== bookId);
                localStorage.setItem('my_favorites', JSON.stringify(favorites));
                await syncFavoritesToApi(favorites);
                if (favorites.length === 0) setTimeout(loadFavorites, 400);
            }
        }

        async function loadFavorites() {
            const container = document.getElementById('favorites-container');
            const userId = localStorage.getItem('user_id');
            let mockFavorites = [];

            if (userId) {
                try {
                    const res = await fetch(`http://localhost:8000/api/user/favorites/${encodeURIComponent(userId)}`);
                    if (res.ok) {
                        const data = await res.json();
                        mockFavorites = data.favorites || [];
                        localStorage.setItem('my_favorites', JSON.stringify(mockFavorites));
                    }
                } catch (e) { console.warn('Dùng cache do lỗi API'); }
            }

            if (mockFavorites.length === 0) {
                try { mockFavorites = JSON.parse(localStorage.getItem('my_favorites') || '[]') || []; } catch (e) {}
            }

            container.innerHTML = '';
            if (mockFavorites.length === 0) {
                container.innerHTML = `<div class="empty-favorites"><i class="fa-solid fa-heart-crack"></i><h2>Thư viện còn trống</h2><p>Bạn chưa thả tim cuốn sách nào cả. Hãy khám phá và lưu lại những cuốn bạn thích nhé!</p><a href="danh_cho_bn.html" class="btn-explore">Khám phá ngay</a></div>`;
                return;
            }
            let gridHTML = `<div class="book-grid">`;
            mockFavorites.forEach(book => {
                gridHTML += createFavBookCard(book.id, book.img || 'bia_sach/bia_sach_chx_co.png', book.title || 'Chưa có tên', book.author || 'Chưa rõ', book.rating);
            });
            gridHTML += `</div>`;
            container.innerHTML = gridHTML;
        }

        loadFavorites();
    </script>
</body>
</html>
